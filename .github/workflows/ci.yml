name: Quote Engine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quote_test
          POSTGRES_PASSWORD: quote_test_ci_only
          POSTGRES_DB: manufacturing_quote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quote_test -d manufacturing_quote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUOTEENGINE_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=manufacturing_quote_test;Username=quote_test;Password=quote_test_ci_only
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore pinned dependencies
        run: dotnet restore QuoteEngine.sln --locked-mode
      - name: Unit and real PostgreSQL integration tests
        run: dotnet test QuoteEngine.sln --configuration Release --no-restore --logger "trx;LogFilePrefix=quote-engine" --results-directory artifacts/test-results
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-engine-test-results
          path: artifacts/test-results/*.trx
