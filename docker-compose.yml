name: manufacturing-quote

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quote_test
      POSTGRES_PASSWORD: quote_test_local_only
      POSTGRES_DB: manufacturing_quote_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - quote_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_test -d manufacturing_quote_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  quote_test_data:
